# 舆情采集·品牌信息总量搜索词（spec 4.1 / 4.3 / 4.5）
# 搜"总量"（正面 + 中性 + 负面），再用 negative_theme_keywords.yaml 分类筛负面。
# 分母 = 品牌信息总量，分子 = 命中负面关键词的条数。
# 2026-09-01 补负面倾向搜索词（spec 4.5 双形态配套）：
#   差评/投诉/踩雷/吐槽（UGC 差评形态）+ 曝光/约谈/处罚/丑闻（舆情新闻形态）——
#   原搜索词只搜"评价/推荐"偏正面，负面内容不被召回，关键词库空转（福州香格里拉实测 0 负面即采集偏颇所致）。
category: sentiment_query
description: 舆情采集·品牌信息总量搜索词。搜总量 → 负面关键词库分类 → 负面率。含负面倾向召回词（双形态）。
items:
  - id: store_level
    zh: 门店级信息总量（带城市）
    queries: [
      "{品牌}酒店 {城市} 评价", "{品牌}酒店 {城市} 怎么样", "{品牌}酒店 {城市} 推荐",
      "{品牌}酒店 {城市} 差评", "{品牌}酒店 {城市} 投诉", "{品牌}酒店 {城市} 踩雷 避雷",
      "{品牌}酒店 {城市} 不推荐 吐槽", "{品牌}酒店 {城市} 问题 缺点"
    ]
  - id: brand_level
    zh: 品牌级信息总量（国内，跨省算/跨国不算）
    queries: [
      "{品牌}酒店集团 口碑", "{品牌}酒店集团 评价",
      "{品牌}酒店集团 差评", "{品牌}酒店集团 投诉", "{品牌}酒店集团 曝光",
      "{品牌}酒店集团 约谈 处罚", "{品牌}酒店集团 丑闻 争议"
    ]
