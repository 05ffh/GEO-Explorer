category: negative_theme_keywords
description: 8类负面主题判定关键词库。聚焦消费者住宿体验负面（差评UGC + 舆情新闻双形态），覆盖顶奢~经济5档。排除员工劳动纠纷等非消费者视角。用于 P2 舆情采集时分类负面主题。
