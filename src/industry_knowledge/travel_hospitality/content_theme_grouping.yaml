# 报告层·AI 引用内容归并 —— **对齐 8 类甲方资产分类**（gt_facts_json / theme_blocks 同一坐标）。
# 作用：把 AI 引用甲方的同义措辞（江南灶·融府 / 1725㎡宴会厅 / 五一广场…）归并成 8 类资产，
#       让报告「AI 实际引用了什么」与「甲方有什么」**同分类可比**，且与 P4 落地层同坐标。
# 匹配：**按 items 顺序，命中任一关键词即归入该主题**（先命中先归）——故"米其林"排在"荣誉"前。
# 归并原则（第一性原理）：
#   ① 8 类 = 可验证存在性资产（排除价格/品牌）；② "亲子"非资产维度 → 拆到 客房/配套/康体；
#   ③ 第三方评分（9.2/10）非甲方资产 → 不设类，落「其他」。
# ⚠️ 类名须与 gt_facts_json 的 8 类**逐字一致**（否则报告两侧对不上）；换甲方不改类名，只调关键词。
category: content_theme_grouping
description: 报告层——AI 引用内容按 8 类甲方资产归并（顺序匹配，先命中先归）。
items:
  - theme: 餐饮
    keywords: [江南灶, 米其林, 融府, 淮扬, 狮子头, 佛跳墙, 主厨, 黑珍珠, 闽和南, 葵香鸡, 融小馆, 餐厅, 香宫, 夏宫, 自助, 闽菜, 粤菜, 酒廊, 早餐, 招牌菜, 菜, 餐]
  - theme: 会议宴会
    keywords: [宴会厅, 婚宴, 婚礼, 会议, 剧院式, 无柱, 桌, 宴席, 酒席, 宴会, 晚宴, 论坛]
  - theme: 位置交通
    keywords: [五一广场, 地铁, 南门兜, 三坊七巷, 地址, 地段, 心脏地带, 于山, 乌山, 公里, 步行, 鼓楼, 交通, 地标]
  - theme: 康体设施
    keywords: [泳池, 按摩浴缸, 健身, 恒温, 水疗]
  - theme: 客房
    keywords: [客房, 房型, 天际房, 高层, 俯瞰, 间房, 家庭房, 亲子房, 床, 层, 夜景]
  - theme: 配套
    keywords: [八匚汇, 商业体, 商场, 购物, 芽宝, 儿童乐园, 儿童俱乐部, 游乐, 滑雪]
  - theme: 服务
    keywords: [服务, 管家, 接待, 周到]
  - theme: 荣誉
    keywords: [老牌, 五星, "2005", 开业, 集团, 品牌, 奖]
