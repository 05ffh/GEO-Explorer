# 品牌中英文对照 + 官网域名关键词 + 品牌梯队（官网判定 + 档位评定用）
# 2026-09-01 重设计：去顶奢（并入豪华）、加中高端；tier + adr_range 双字段。
# tier：品牌行政档位（跨城市稳定）：豪华/高端/中高端/中端/经济。
# tier_source（2026-09-10 加，provenance）：档位来源——brand=官网自述/品牌官方定位（国际五星等）
#   / ota=OTA 分类+业界共识 / manual=主 agent 认定（缺省）。改 tier 时同步更新，防无依据篡改。
# adr_range：[下限, 上限] 中国市场典型 ADR 带（门店 ADR 校准用：低于下限或高于上限 → 取市场价落点）。
# zh 注意：子品牌用全名（如"希尔顿欢朋"）优先于父品牌（"希尔顿"），避免匹配歧义。
# domain_keywords：官网域名里最可能出现的子串（英文名小写 + 连字符/拼音变体）。
category: brand_domains
description: 品牌中英文对照 + 官网域名关键词 + 品牌行政档位 + 中国市场 ADR 参考带。用于官网判定（T0）和档位评定（品牌梯队 + ADR 校准）。
